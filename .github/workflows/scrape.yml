name: Update movie feed

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Number of pages to scrape'
        required: true
        default: '5'
        type: string
      refetch:
        description: 'Re-fetch metadata for ALL existing movies in data/movies.json'
        required: false
        default: false
        type: boolean
      refetch_unrated:
        description: 'Re-fetch metadata for unrated/incomplete movies'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: feed-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Automatically caches pip dependencies based on requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('scripts/requirements.txt') }}

      # Install Chromium and system dependencies if cache misses
      - name: Install Playwright Browser & Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: playwright install --with-deps chromium

      # Install only OS system dependencies if browser binary is cached
      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: playwright install-deps chromium

      # Validate/repair the cached browser for this exact pinned Playwright version.
      - name: Ensure Playwright Browser Is Installed
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 6
        run: playwright install chromium

      - name: Run scraper
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MAX_PAGES: ${{ inputs.max_pages || '5' }}
          REFETCH: ${{ inputs.refetch || 'false' }}
          REFETCH_UNRATED: ${{ inputs.refetch_unrated || 'true' }}
        run: python scripts/scrape.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/movies.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated feed update: $(date -u)" && git push)
