name: Update movie feed

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Number of pages to scrape'
        required: true
        default: '5'
        type: string
      refetch:
        description: 'Re-fetch metadata for ALL existing movies in data/movies.json'
        required: false
        default: false
        type: boolean
      refetch_unrated:
        description: 'Re-fetch metadata for unrated/incomplete movies'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Automatically caches pip dependencies based on requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      # Always install Chromium along with required Linux system packages
      - name: Install Playwright Browser
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MAX_PAGES: ${{ inputs.max_pages || '5' }}
          REFETCH: ${{ inputs.refetch || 'false' }}
          REFETCH_UNRATED: ${{ inputs.refetch_unrated || 'true' }}
        run: python scripts/scrape.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/movies.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated feed update: $(date -u)" && git push)
